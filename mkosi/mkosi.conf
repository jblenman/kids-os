# kids-os — a Chromebook-like Linux for a child's computer: Debian + Google Chrome + a small Wayland shell.
# Built with mkosi (systemd's image builder): boots on legacy BIOS *and* EFI, Chrome full-screen as the `kid` user,
# Wi-Fi, sshd for the admin. Verity / A-B / updates come in later versions (docs/decisions.md).

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,contrib,non-free-firmware

[Output]
Format=disk
ImageId=kids-os
ImageVersion=0.22
CompressOutput=no

[Content]
Hostname=kids-desktop
Locale=en_US.UTF-8
Bootable=yes
Bootloader=grub
BiosBootloader=grub
# video=VGA-1:d — some Sandy Bridge boards report a phantom 1024x768 display on the VGA port (docs/hardware-notes.md)
# nouveau blacklisted — a discrete NVIDIA card stays idle; Chrome renders on the Intel iGPU
KernelCommandLine=console=ttyS0,115200 console=tty1 quiet loglevel=3 video=VGA-1:d modprobe.blacklist=nouveau nouveau.modeset=0 systemd.show_status=false
Packages=
        linux-image-amd64
        firmware-linux-free
        firmware-realtek
        firmware-misc-nonfree
        intel-microcode
        systemd
        systemd-sysv
        systemd-resolved
        systemd-timesyncd
        systemd-repart
        udev
        dbus
        dbus-user-session
        kmod
        util-linux
        e2fsprogs
        fdisk
        apt
        tzdata
        usbutils
        rsync
        python3
        procps
        iproute2
        grub-efi-amd64-bin
        grub-pc-bin
        grub2-common
        dosfstools
        network-manager
        wpasupplicant
        wireless-regdb
        iw
        openssh-server
        sudo
        ca-certificates
        curl
        less
        vim-tiny
        polkitd
        cage
        labwc
        waybar
        swaybg
        grim
        adwaita-icon-theme
        libgl1-mesa-dri
        i965-va-driver
        pipewire
        pipewire-pulse
        wireplumber
        alsa-utils
        fonts-noto-core
        fonts-noto-color-emoji
        xdg-user-dirs
        google-chrome-stable

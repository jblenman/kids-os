<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in</title>
<style>
  :root { --bg1:#1a4f8a; --bg2:#0b1f3a; --fg:#fff; --pad:#ffffff22; --padh:#ffffff3a; }
  /* sized in viewport heights so the whole thing fits any screen (1280x720 logical on the TV at 1.5x) */
  html,body { height:100%; margin:0; overflow:hidden; font-family:"Noto Sans",sans-serif; color:var(--fg); user-select:none; }
  body { background:linear-gradient(var(--bg1),var(--bg2)); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .avatar { width:14vh; height:14vh; border-radius:50%; background:#fff2; display:flex; align-items:center; justify-content:center; font-size:8vh; box-shadow:0 8px 32px #0006; }
  .name { margin:1.5vh 0 .5vh; font-size:3.6vh; font-weight:500; }
  .dots { height:3vh; margin:.5vh 0 1.5vh; display:flex; gap:1.6vh; align-items:center; }
  .dots span { width:1.8vh; height:1.8vh; border-radius:50%; border:2px solid #fff; display:inline-block; }
  .dots span.on { background:#fff; }
  .pad { display:grid; grid-template-columns:repeat(3,11vh); gap:1.6vh; }
  .pad button { height:11vh; border:0; border-radius:50%; background:var(--pad); color:var(--fg); font:4.4vh "Noto Sans",sans-serif; cursor:pointer; }
  .pad button:hover { background:var(--padh); } .pad button:active { transform:scale(.95); }
  .pad .small { font-size:3vh; }
  .msg { height:3.4vh; margin-top:1.2vh; font-size:2.4vh; opacity:.9; }
  .power { position:fixed; left:28px; bottom:24px; display:flex; gap:12px; }
  .power button { background:#fff2; color:#fff; border:0; border-radius:24px; padding:12px 22px; font:20px "Noto Sans",sans-serif; cursor:pointer; }
  .shake { animation:shake .4s; } @keyframes shake { 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }
</style></head>
<body>
  <div class="avatar" id="avatar">🧒</div>
  <div class="name" id="name">Kids</div>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
  <div class="msg" id="msg"></div>
  <div class="power"><button onclick="power('poweroff')">⏻ Shut down</button><button onclick="power('reboot')">↻ Restart</button></div>
<script>
let pin = "", busy = false;
const dots = document.getElementById("dots"), msg = document.getElementById("msg");
function draw(){ dots.innerHTML = ""; for (let i = 0; i < Math.max(4, pin.length); i++) { const s = document.createElement("span"); if (i < pin.length) s.className = "on"; dots.appendChild(s); } }
function key(k){ if (busy) return; if (k === "⌫") pin = pin.slice(0,-1); else if (k === "⏎") return submit(); else if (pin.length < 8) pin += k; draw(); msg.textContent = ""; }
async function submit(){
  if (pin.length < 4 || busy) return; busy = true; msg.textContent = "…";
  const r = await fetch("/api/unlock", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({pin})}).catch(() => null);
  if (r && r.ok) { msg.textContent = "Welcome!"; return; }
  busy = false; pin = ""; draw(); msg.textContent = "Try again"; document.body.classList.add("shake"); setTimeout(() => document.body.classList.remove("shake"), 450);
}
function power(action){ fetch("/api/power", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({action})}); }
for (const k of ["1","2","3","4","5","6","7","8","9","⌫","0","⏎"]) { const b = document.createElement("button"); b.textContent = k; if (k === "⌫" || k === "⏎") b.className = "small"; b.onclick = () => key(k); document.getElementById("pad").appendChild(b); }
document.addEventListener("keydown", e => { if (/^[0-9]$/.test(e.key)) key(e.key); else if (e.key === "Backspace") key("⌫"); else if (e.key === "Enter") key("⏎"); });
fetch("/api/config").then(r => r.json()).then(c => { document.getElementById("name").textContent = c.name || "Kids"; document.getElementById("avatar").textContent = c.avatar || "🧒"; if (!c.pin_set) submit(); }).catch(() => {});
draw();
</script></body></html>

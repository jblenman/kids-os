# The NVIDIA card's HDMI audio controller (PCI 01:00.1) has no display driver behind it on this box
# (nouveau is blacklisted); leave it out of PipeWire so it cannot keep wireplumber busy. Sound goes out
# through the Intel PCH's HDMI codec.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.pci-0000_01_00.1" } ]
    actions = { update-props = { device.disabled = true } }
  }
]

# Grows the build-time kids-data partition (right after the root) in place on first boot, to the whole medium.
# A build with KIDS_OS_DATA_MAX=<size> appends SizeMaxBytes here (mkosi.postinst) for a stick whose real capacity is in doubt.
# Nothing a login depends on lives on this partition.
[Partition]
Type=linux-generic
Label=kids-data
SizeMinBytes=256M
GrowFileSystem=yes

# Grows the build-time kids-data partition (right after the root) in place on first boot.
# SizeMaxBytes=32G while the target is the no-brand 1 TB USB stick (only its first ~32 GiB are proven real);
# raise/remove the cap for real media (the 256 GB stick, an SSD). Nothing a login depends on lives here.
[Partition]
Type=linux-generic
Label=kids-data
SizeMinBytes=256M
SizeMaxBytes=32G
GrowFileSystem=yes

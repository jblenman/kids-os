# /data pre-placed right after the root at build time (256 MiB, empty ext4) so its position never depends on
# systemd-repart's choice on the target disk; usr/lib/repart.d/20-data.conf grows it in place on first boot.
[Partition]
Type=linux-generic
Label=kids-data
Format=ext4
SizeMinBytes=256M
SizeMaxBytes=256M
